<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Wave gradient (cyan -> indigo), matches the brand. -->
    <linearGradient id="wave" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#6366F1"/>
    </linearGradient>
    <!-- Subtle vertical brand wash over the dark base (top -> bottom). -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#173042"/>
      <stop offset="0.55" stop-color="#0A0F16"/>
      <stop offset="1" stop-color="#07090D"/>
    </linearGradient>
    <clipPath id="tile">
      <rect x="0" y="0" width="64" height="64" rx="14" ry="14"/>
    </clipPath>
  </defs>
  <!-- Full-bleed dark face (no border), matching the app icon. -->
  <g clip-path="url(#tile)">
    <rect x="0" y="0" width="64" height="64" fill="#07090D"/>
    <rect x="0" y="0" width="64" height="64" fill="url(#bg)"/>
    <!-- Bold EKG wave, centered. -->
    <path d="M10 33 L21 33 L27 15 L33 47 L39 24 L45 33 L54 33"
          fill="none" stroke="url(#wave)" stroke-width="5"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
